<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background:#f0f2f5; color:#333; }
:root {
  --primary: #4f46e5; --primary-light: #818cf8; --danger: #ef4444; --warning: #f59e0b;
  --success: #10b981; --info: #3b82f6; --bg-card: #fff; --border: #e5e7eb;
  --text: #1f2937; --text-secondary: #6b7280;
}

/* Header */
.header { background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4338ca 100%); color:#fff; padding:20px 32px; display:flex; justify-content:space-between; align-items:center; }
.header h1 { font-size:22px; font-weight:700; }
.header .subtitle { font-size:13px; opacity:.75; margin-top:4px; }
.header .actions { display:flex; gap:10px; }

/* Layout */
.container { display:flex; height:calc(100vh - 81px); }
.sidebar { width:220px; background:#fff; border-right:1px solid var(--border); padding:16px 0; overflow-y:auto; }
.sidebar .nav-item { display:block; padding:10px 24px; color:var(--text-secondary); text-decoration:none; font-size:14px; cursor:pointer; transition:.15s; border-left:3px solid transparent; }
.sidebar .nav-item:hover { background:#f3f4f6; color:var(--text); }
.sidebar .nav-item.active { color:var(--primary); background:#eef2ff; border-left-color:var(--primary); font-weight:600; }
.main { flex:1; overflow-y:auto; padding:24px 28px; }

/* Filters */
.filters { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:20px; align-items:center; }
.filters label { font-size:13px; color:var(--text-secondary); }
.filters select { padding:6px 12px; border:1px solid var(--border); border-radius:6px; font-size:13px; background:#fff; min-width:120px; }
.btn { padding:8px 18px; border:none; border-radius:6px; font-size:13px; cursor:pointer; font-weight:500; transition:.15s; }
.btn-primary { background:var(--primary); color:#fff; }
.btn-primary:hover { background:#4338ca; }
.btn-outline { background:#fff; color:var(--primary); border:1px solid var(--primary); }
.btn-outline:hover { background:#eef2ff; }
.btn-success { background:var(--success); color:#fff; }
.btn-success:hover { opacity:.9; }

/* Cards */
.stat-cards { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:16px; margin-bottom:24px; }
.stat-card { background:var(--bg-card); border-radius:10px; padding:18px 20px; border:1px solid var(--border); }
.stat-card .label { font-size:12px; color:var(--text-secondary); margin-bottom:6px; }
.stat-card .value { font-size:28px; font-weight:700; }
.stat-card .value.danger { color:var(--danger); }
.stat-card .value.success { color:var(--success); }
.stat-card .value.warning { color:var(--warning); }

/* Chart grid */
.chart-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:24px; }
.chart-grid .full { grid-column:1 / -1; }
.chart-card { background:var(--bg-card); border-radius:10px; padding:20px; border:1px solid var(--border); position:relative; min-height:380px; }
.chart-card h3 { font-size:15px; font-weight:600; margin-bottom:16px; color:var(--text); }
.chart-card canvas { display:block; max-height:320px; min-height:300px; }

/* Table */
.data-table { width:100%; border-collapse:collapse; font-size:13px; }
.data-table th { background:#f8fafc; padding:10px 12px; text-align:left; font-weight:600; color:var(--text-secondary); border-bottom:2px solid var(--border); white-space:nowrap; }
.data-table td { padding:8px 12px; border-bottom:1px solid var(--border); }
.data-table tr:hover td { background:#f8fafc; }
.data-table .highlight { background:#fef3c7; border-radius:3px; padding:2px 6px; }

/* Upload zone */
.upload-zone { border:2px dashed var(--border); border-radius:10px; padding:48px; text-align:center; cursor:pointer; transition:.2s; background:var(--bg-card); }
.upload-zone:hover { border-color:var(--primary); background:#eef2ff; }
.upload-zone .icon { font-size:40px; margin-bottom:12px; }
.upload-zone .text { font-size:14px; color:var(--text-secondary); }
.upload-zone .hint { font-size:12px; color:#9ca3af; margin-top:6px; }

/* Progress bar */
.progress-bar { height:8px; border-radius:4px; background:#e5e7eb; overflow:hidden; }
.progress-fill { height:100%; border-radius:4px; transition:width .3s; }
.progress-fill.high { background:var(--danger); }
.progress-fill.mid { background:var(--warning); }
.progress-fill.low { background:var(--success); }

/* Tabs */
.tabs { display:flex; gap:4px; margin-bottom:20px; background:#e5e7eb; border-radius:8px; padding:4px; width:fit-content; }
.tabs .tab { padding:6px 16px; border-radius:6px; font-size:13px; cursor:pointer; border:none; background:none; color:var(--text-secondary); }
.tabs .tab.active { background:#fff; color:var(--primary); font-weight:600; box-shadow:0 1px 3px rgba(0,0,0,.1); }

/* Badge */
.badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:600; }
.badge-success { background:#d1fae5; color:#065f46; }
.badge-warning { background:#fef3c7; color:#92400e; }
.badge-danger { background:#fee2e2; color:#991b1b; }

/* Toast */
.toast { position:fixed; top:20px; right:20px; padding:12px 20px; border-radius:8px; color:#fff; font-size:14px; z-index:9999; transition:opacity .3s; opacity:0; pointer-events:none; }
.toast.show { opacity:1; }
.toast.success { background:var(--success); }
.toast.error { background:var(--danger); }

/* Section divider */
.section-title { font-size:18px; font-weight:700; margin:24px 0 16px; padding-bottom:8px; border-bottom:2px solid var(--border); color:var(--text); }

/* Cross-comparison heatmap */
.heatmap-cell { text-align:center; padding:6px 10px; font-size:12px; font-weight:600; border-radius:4px; color:#fff; }
</style>
</head>

<script>
let currentView = 'overview';
function refreshCurrentView() { switchView(currentView); }

try {
  window.rawQuestions = JSON.parse(document.getElementById('data-questions').value);
  window.rawStudents = JSON.parse(document.getElementById('data-students').value);
  window.dataLoaded = true;
  // Initialize grade data store
  window.gradeData = window.gradeData || {};
  const grades = [...new Set(window.rawQuestions.map(d => d['年级']).filter(Boolean))];
  grades.forEach(g => {
    window.gradeData[g] = {
      questions: window.rawQuestions.filter(d => d['年级'] === g),
      students: window.rawStudents.filter(s => s['年级'] === g || !s['年级'])
    };
  });
  checkLocalData();
  switchView('overview');
} catch(err) {
  document.getElementById('main-content').innerHTML = '<div style="padding:40px;color:#ef4444;"><h3>数据加载失败</h3><pre style="background:#f8f8f8;padding:12px;border-radius:6px;overflow:auto;">'+err.toString()+'</pre></div>';
  console.error(err);
}

// ============ CHART REGISTRY ============
window._charts = {};
function destroyAllCharts() {
  Object.values(window._charts || {}).forEach(c => c && typeof c.destroy === 'function' && c.destroy());
  window._charts = {};
}
function createChart(key, canvas, config) {
  if (!canvas) return null;
  const ctx = canvas.getContext('2d');
  const chart = new Chart(ctx, config);
  window._charts[key] = chart;
  return chart;
}

function safeFloat(v) {
  if (v === undefined || v === null || v === '') return 0;
  const n = parseFloat(String(v).replace(/,/g, ''));
  return isNaN(n) ? 0 : n;
}

function safePct(v) {
  if (v === undefined || v === null || v === '') return 0;
  const s = String(v).trim().replace('%', '').replace(/,/g, '');
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

function safeCalcRate(deducted, total) {
  if (total === 0) return 0;
  return (deducted / total) * 100;
}

function getExamType(d) {
  return (d['考试类型'] || d['考试类别'] || '').trim();
}

function getSemester(d) {
  return (d['学期'] || '').trim();
}

function getFilteredData() {
  if (!window.rawQuestions) return [];
  const grade = document.getElementById('f-grade')?.value || '';
  const region = document.getElementById('f-region')?.value || '';
  const module = document.getElementById('f-module')?.value || '';
  const score = document.getElementById('f-score')?.value || '';
  const semester = document.getElementById('f-semester')?.value || '';
  const examType = document.getElementById('f-exam-type')?.value || '';

  return window.rawQuestions.filter(d => {
    if (grade && d['年级'] !== grade) return false;
    if (region && d['生源地'] !== region) return false;
    if (module && d['一级模块'] !== module) return false;
    if (score && d['失分率区间'] !== score) return false;
    if (semester && getSemester(d) !== semester) return false;
    if (examType && getExamType(d) !== examType) return false;
    return true;
  });
}

function showToast(msg) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.style.display = 'block';
  el.style.opacity = '1';
  setTimeout(() => {
    el.style.opacity = '0';
    setTimeout(() => el.style.display = 'none', 300);
  }, 2500);
}

function filterBarHTML() {
  const questions = window.rawQuestions;
  const grades = [...new Set(questions.map(d=>d['年级']).filter(Boolean))].sort();
  const regions = [...new Set(questions.map(d=>d['生源地']).filter(Boolean))].sort();
  const modules = [...new Set(questions.map(d=>d['一级模块']).filter(Boolean))].sort();
  const scores = ['0-20%','20-40%','40-60%','60-80%','80-100%'];
  const semesters = [...new Set(questions.map(getSemester).filter(Boolean))].sort();
  const examTypes = [...new Set(questions.map(getExamType).filter(Boolean))].sort();

  return `
  <div class="filters">
    <label>年级</label>
    <select id="f-grade" onchange="refreshCurrentView()">
      <option value="">全部</option>
      ${grades.map(g=>`<option value="${g}">${g}</option>`).join('')}
    </select>
    <label>地区</label>
    <select id="f-region" onchange="refreshCurrentView()">
      <option value="">全部</option>
      ${regions.map(r=>`<option value="${r}">${r}</option>`).join('')}
    </select>
    <label>一级模块</label>
    <select id="f-module" onchange="refreshCurrentView()">
      <option value="">全部</option>
      ${modules.map(m=>`<option value="${m}">${m}</option>`).join('')}
    </select>
    <label>失分率区间</label>
    <select id="f-score" onchange="refreshCurrentView()">
      <option value="">全部</option>
      ${scores.map(s=>`<option value="${s}">${s}</option>`).join('')}
    </select>
    ${semesters.length > 0 ? `<label>学期</label><select id="f-semester" onchange="refreshCurrentView()"><option value="">全部</option>${semesters.map(s=>`<option value="${s}">${s}</option>`).join('')}</select>` : ''}
    ${examTypes.length > 0 ? `<label>考试类型</label><select id="f-exam-type" onchange="refreshCurrentView()"><option value="">全部</option>${examTypes.map(e=>`<option value="${e}">${e}</option>`).join('')}</select>` : ''}
    <button class="btn btn-outline" onclick="resetFilters()">重置筛选</button>
  </div>`;
}

function resetFilters() {
  ['f-grade','f-region','f-module','f-score','f-semester','f-exam-type'].forEach(id => {
    const el = document.getElementById(id); if (el) el.value = '';
  });
  refreshCurrentView();
}

function switchView(view, el) {
  currentView = view;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  if (el) el.classList.add('active');
  else document.querySelector(`.nav-item[data-view="${view}"]`)?.classList.add('active');

  if (!window.rawQuestions || !window.rawStudents) {
    document.getElementById('main-content').innerHTML = '<div style="text-align:center;padding:60px;color:#999;">数据加载中...</div>';
    return;
  }

  destroyAllCharts();

  switch(view) {
    case 'overview': renderOverview(); break;
    case 'module': renderModule(); break;
    case 'error': renderError(); break;
    case 'cross': renderCross(); break;
    case 'students': renderStudents(); break;
    case 'grade': renderGradeCompare(); break;
    case 'semester': renderSemesterCompare(); break;
    case 'update': renderUpdate(); break;
  }
}

// ============ OVERVIEW ============
function renderOverview() {
  const questions = getFilteredData();
  const students = window.rawStudents;
  
  // Summary stats
  const totalQ = questions.length;
  const totalDeducted = questions.reduce((s,d) => s + safeFloat(d['扣分']), 0);
  const totalMax = questions.reduce((s,d) => s + safeFloat(d['满分']), 0);
  const overallRate = safeCalcRate(totalDeducted, totalMax);
  const hasError = questions.filter(d => safeFloat(d['扣分']) > 0).length;
  const studentCount = students.length;
  
  // Module aggregation
  const modules = {};
  questions.forEach(d => {
    const m = d['一级模块'];
    if (!m) return;
    if (!modules[m]) modules[m] = { deducted: 0, total: 0 };
    modules[m].deducted += safeFloat(d['扣分']);
    modules[m].total += safeFloat(d['满分']);
  });

  const moduleNames = Object.keys(modules).sort((a,b) => {
    return safeCalcRate(modules[b].deducted, modules[b].total) - safeCalcRate(modules[a].deducted, modules[a].total);
  });
  const moduleRates = moduleNames.map(m => safeCalcRate(modules[m].deducted, modules[m].total));
  const moduleColors = moduleRates.map(r => r > 50 ? '#ef4444' : r > 30 ? '#f59e0b' : '#10b981');

  // Score distribution
  const scoreDist = { '80-100%':0, '60-80%':0, '40-60%':0, '20-40%':0, '0-20%':0 };
  students.forEach(s => {
    const r = s['得分率区间']; if (scoreDist.hasOwnProperty(r)) scoreDist[r]++;
  });

  const html = `
    ${filterBarHTML()}
    <div class="stat-cards">
      <div class="stat-card"><div class="label">学员总数</div><div class="value">${studentCount}<span style="font-size:14px;color:#6b7280;"> 人</span></div></div>
      <div class="stat-card"><div class="label">题目总数</div><div class="value">${totalQ}<span style="font-size:14px;color:#6b7280;"> 题</span></div></div>
      <div class="stat-card"><div class="label">整体失分率</div><div class="value ${overallRate>40?'danger':overallRate>25?'warning':'success'}">${overallRate.toFixed(1)}%</div></div>
      <div class="stat-card"><div class="label">有错误题目</div><div class="value warning">${hasError}<span style="font-size:14px;color:#6b7280;"> / ${totalQ}</span></div></div>
      <div class="stat-card"><div class="label">地区覆盖</div><div class="value">${[...new Set(questions.map(d=>d['生源地']))].length}<span style="font-size:14px;color:#6b7280;"> 省/市</span></div></div>
    </div>

    <div class="chart-grid">
      <div class="chart-card">
        <h3>一级模块失分率排名</h3>
        <canvas id="chart-module-bar"></canvas>
      </div>
      <div class="chart-card">
        <h3>学员分数段分布</h3>
        <canvas id="chart-score-pie"></canvas>
      </div>
    </div>

    <div class="chart-grid">
      <div class="chart-card full">
        <h3>地区失分率对比（Top 15）</h3>
        <canvas id="chart-region-bar"></canvas>
      </div>
    </div>
  `;

  document.getElementById('main-content').innerHTML = html;

  // Chart 1: Module bar
  createChart('module-bar', document.getElementById('chart-module-bar'), {
    type: 'bar',
    data: {
      labels: moduleNames,
      datasets: [{
        label: '失分率 (%)',
        data: moduleRates,
        backgroundColor: moduleColors,
        borderRadius: 6
      }]
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        x: { max: 100, ticks: { callback: v => v + '%' } }
      }
    }
  });

  // Chart 2: Score distribution pie
  createChart('score-pie', document.getElementById('chart-score-pie'), {
    type: 'doughnut',
    data: {
      labels: Object.keys(scoreDist),
      datasets: [{
        data: Object.values(scoreDist),
        backgroundColor: ['#10b981','#3b82f6','#f59e0b','#f97316','#ef4444'],
        borderWidth: 2,
        borderColor: '#fff'
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { position: 'bottom' },
        tooltip: { callbacks: { label: ctx => `${ctx.label}: ${ctx.raw} 人` } }
      }
    }
  });

  // Chart 3: Region comparison
  const regionMap = {};
  questions.forEach(d => {
    const r = d['生源地']; if (!r) return;
    if (!regionMap[r]) regionMap[r] = {deducted:0, total:0};
    regionMap[r].deducted += safeFloat(d['扣分']);
    regionMap[r].total += safeFloat(d['满分']);
  });
  const regionEntries = Object.entries(regionMap)
    .map(([k,v]) => ({name:k, rate: safeCalcRate(v.deducted, v.total)}))
    .sort((a,b) => b.rate - a.rate).slice(0, 15);

  createChart('region-bar', document.getElementById('chart-region-bar'), {
    type: 'bar',
    data: {
      labels: regionEntries.map(e=>e.name),
      datasets: [{
        label: '失分率 (%)',
        data: regionEntries.map(e=>e.rate),
        backgroundColor: regionEntries.map(e=>e.rate>40?'#ef4444':e.rate>25?'#f59e0b':'#3b82f6'),
        borderRadius: 4
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: { y: { ticks: { callback: v => v+'%' } } }
    }
  });
}

// ============ MODULE ANALYSIS ============
function renderModule() {
  const questions = getFilteredData();

  // By 一级模块, also collect 二级模块 and 三级模块
  const m1Agg = {};
  questions.forEach(d => {
    const m = d['一级模块']; if (!m) return;
    if (!m1Agg[m]) m1Agg[m] = { deducted:0, total:0, subModules:{} };
    m1Agg[m].deducted += safeFloat(d['扣分']);
    m1Agg[m].total += safeFloat(d['满分']);
    const sm = d['二级模块']; if (!sm) return;
    if (!m1Agg[m].subModules[sm]) m1Agg[m].subModules[sm] = { deducted:0, total:0, count:0, level3Modules:{} };
    m1Agg[m].subModules[sm].deducted += safeFloat(d['扣分']);
    m1Agg[m].subModules[sm].total += safeFloat(d['满分']);
    m1Agg[m].subModules[sm].count++;

    // 三级模块（仅当存在时）
    const l3 = (d['三级模块'] || '').trim();
    if (l3) {
      if (!m1Agg[m].subModules[sm].level3Modules[l3]) m1Agg[m].subModules[sm].level3Modules[l3] = { deducted:0, total:0, count:0, errorAgg:{} };
      m1Agg[m].subModules[sm].level3Modules[l3].deducted += safeFloat(d['扣分']);
      m1Agg[m].subModules[sm].level3Modules[l3].total += safeFloat(d['满分']);
      m1Agg[m].subModules[sm].level3Modules[l3].count++;
      let ep = (d['错误点'] || '').trim().replace(/\n/g, '、');
      if (ep && ep !== '无' && ep !== '/') {
        const l3obj = m1Agg[m].subModules[sm].level3Modules[l3];
        if (!l3obj.errorAgg[ep]) l3obj.errorAgg[ep] = { count:0, deducted:0 };
        l3obj.errorAgg[ep].count++;
        l3obj.errorAgg[ep].deducted += safeFloat(d['扣分']);
      }
    }
  });

  const m1Sorted = Object.entries(m1Agg).sort((a,b) => {
    return safeCalcRate(b[1].deducted, b[1].total) - safeCalcRate(a[1].deducted, a[1].total);
  });

  // Module tabs
  const m1Names = m1Sorted.map(([k]) => k);
  const activeTab = m1Names[0] || '';
  let html = filterBarHTML();
  html += '<h3 style="margin-bottom:12px;">模块详细分析</h3>';
  html += `<div class="tabs" id="module-tabs">${m1Names.map((m,i)=>
    `<button class="tab ${i===0?'active':''}" onclick="switchModuleTab('${m.replace(/'/g,"\\'")}')">${m}</button>`
  ).join('')}</div>`;
  html += `<div id="module-detail"></div>`;

  document.getElementById('main-content').innerHTML = html;
  window._m1Data = m1Agg;
  setTimeout(() => switchModuleTab(activeTab), 50);

  // Overall module chart
  const overallHtml = `
    <div class="chart-grid" style="margin-top:20px;">
      <div class="chart-card full">
        <h3>一级模块失分率与总扣分对比</h3>
        <canvas id="chart-m1-overview"></canvas>
      </div>
    </div>
  `;
  document.getElementById('main-content').insertAdjacentHTML('beforeend', overallHtml);

  const m1Names2 = m1Sorted.map(([k]) => k);
  const m1Rates = m1Sorted.map(([,v]) => safeCalcRate(v.deducted, v.total));
  const m1Counts = m1Sorted.map(([,v]) => v.deducted);

  createChart('m1-overview', document.getElementById('chart-m1-overview'), {
    type: 'bar',
    data: {
      labels: m1Names2,
      datasets: [
        { label: '失分率 (%)', data: m1Rates, backgroundColor: '#4f46e5', borderRadius: 4, yAxisID: 'y' },
        { label: '总扣分', data: m1Counts, backgroundColor: '#f59e0b', borderRadius: 4, yAxisID: 'y1' }
      ]
    },
    options: {
      responsive: true,
      plugins: { tooltip: { mode: 'index' } },
      scales: {
        y: { type:'linear', position:'left', title:{display:true, text:'失分率 (%)'}, ticks:{callback:v=>v+'%'} },
        y1: { type:'linear', position:'right', title:{display:true, text:'总扣分'}, grid:{drawOnChartArea:false} }
      }
    }
  });
}

function switchModuleTab(m1Name) {
  document.querySelectorAll('#module-tabs .tab').forEach(t => t.classList.remove('active'));
  event?.target?.classList.add('active');

  const data = window._m1Data[m1Name];
  if (!data) return;

  const subSorted = Object.entries(data.subModules).sort((a,b) => {
    return safeCalcRate(b[1].deducted, b[1].total) - safeCalcRate(a[1].deducted, a[1].total);
  });

  let html = `<div style="margin-top:16px;">`;
  html += `<div class="stat-cards" style="grid-template-columns:repeat(3,1fr);max-width:600px;">
    <div class="stat-card"><div class="label">题目数量</div><div class="value">${subSorted.reduce((s,[,v])=>s+v.count,0)}</div></div>
    <div class="stat-card"><div class="label">总扣分</div><div class="value warning">${data.deducted.toFixed(1)}</div></div>
    <div class="stat-card"><div class="label">模块失分率</div><div class="value ${safeCalcRate(data.deducted,data.total)>40?'danger':safeCalcRate(data.deducted,data.total)>25?'warning':'success'}">${safeCalcRate(data.deducted,data.total).toFixed(1)}%</div></div>
  </div>`;

  html += `<table class="data-table" style="margin-top:12px;">
    <thead><tr><th>二级模块</th><th>题目数</th><th>总扣分</th><th>总满分</th><th>失分率</th><th>失分程度</th></tr></thead>
    <tbody>`;
  subSorted.forEach(([name, sm]) => {
    const rate = safeCalcRate(sm.deducted, sm.total);
    const badge = rate > 50 ? '<span class="badge badge-danger">高危</span>' : rate > 30 ? '<span class="badge badge-warning">关注</span>' : '<span class="badge badge-success">良好</span>';
    html += `<tr>
      <td><strong>${name}</strong></td>
      <td>${sm.count}</td>
      <td>${sm.deducted.toFixed(1)}</td>
      <td>${sm.total.toFixed(0)}</td>
      <td>
        <div style="display:flex;align-items:center;gap:8px;">
          <div class="progress-bar" style="flex:1"><div class="progress-fill ${rate>50?'high':rate>30?'mid':'low'}" style="width:${Math.min(rate,100)}%"></div></div>
          <span style="font-size:12px;font-weight:600;">${rate.toFixed(1)}%</span>
        </div>
      </td>
      <td>${badge}</td>
    </tr>`;
  });
  html += '</tbody></table>';

  // ── 三级模块 + 错误点分析 ──
  // Flatten all 三级模块 across sub-modules
  let l3Rows = [];
  subSorted.forEach(([smName, sm]) => {
    if (!sm.level3Modules) return;
    Object.entries(sm.level3Modules).forEach(([l3Name, l3]) => {
      const rate = safeCalcRate(l3.deducted, l3.total);
      const topErrors = Object.entries(l3.errorAgg)
        .map(([k,v]) => ({name:k, count:v.count, avg:v.deducted/v.count}))
        .sort((a,b) => b.count - a.count)
        .slice(0, 3);
      l3Rows.push({ smName, l3Name, ...l3, rate, topErrors });
    });
  });
  l3Rows.sort((a,b) => b.rate - a.rate);

  if (l3Rows.length > 0) {
    window._l3Rows = l3Rows;
    const smNames = [...new Set(l3Rows.map(r => r.smName))];
    const l3Names = [...new Set(l3Rows.map(r => r.l3Name))];
    html += `
      <div class="chart-card" style="margin-top:20px;">
        <h3>📐 三级模块错误点分析</h3>
        <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;align-items:center;padding:12px;background:#f8fafc;border-radius:8px;border:1px solid var(--border);">
          <div style="display:flex;align-items:center;gap:6px;">
            <label style="font-size:13px;color:var(--text-secondary);white-space:nowrap;">二级模块</label>
            <select id="l3-filter-sm" onchange="filterLevel3()" style="padding:6px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:#fff;min-width:130px;">
              <option value="">全部</option>
              ${smNames.map(n => `<option value="${n}">${n}</option>`).join('')}
            </select>
          </div>
          <div style="display:flex;align-items:center;gap:6px;">
            <label style="font-size:13px;color:var(--text-secondary);white-space:nowrap;">三级模块</label>
            <select id="l3-filter-l3" onchange="filterLevel3()" style="padding:6px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:#fff;min-width:130px;">
              <option value="">全部</option>
              ${l3Names.map(n => `<option value="${n}">${n}</option>`).join('')}
            </select>
          </div>
          <div style="display:flex;align-items:center;gap:6px;flex:1;min-width:180px;">
            <span style="font-size:14px;">🔍</span>
            <input type="text" id="l3-search" placeholder="搜索三级模块/错误点..." oninput="filterLevel3()" style="padding:6px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px;flex:1;max-width:280px;" />
          </div>
          <button class="btn btn-outline" onclick="resetLevel3Filter()" style="font-size:12px;padding:4px 12px;">重置</button>
          <span id="l3-count" style="font-size:12px;color:var(--text-secondary);white-space:nowrap;">共 ${l3Rows.length} 条</span>
        </div>
        <div class="chart-grid" style="margin-top:12px;margin-bottom:16px;">
          <div class="chart-card full" style="margin-bottom:0;">
            <h4>三级模块失分率 TOP</h4>
            <canvas id="chart-level3-rate"></canvas>
          </div>
        </div>
        <table class="data-table" id="l3-table">
          <thead><tr><th>二级模块</th><th>三级模块</th><th>题目数</th><th>总扣分</th><th>失分率</th><th>失分程度</th><th>高频错误点（TOP3）</th></tr></thead>
          <tbody id="l3-table-body">
          ${l3Rows.map(r => renderL3Row(r)).join('')}
          </tbody>
        </table>
        <div id="l3-no-result" style="display:none;text-align:center;padding:32px;color:#9ca3af;font-size:14px;">未找到匹配的三级模块</div>
      </div>
    `;
  }

  html += '</div>';
  document.getElementById('module-detail').innerHTML = html;

  // Draw 三级模块 chart if present
  if (l3Rows.length > 0) {
    drawLevel3Chart(l3Rows);
  }
}

// ── 三级模块错误点分析：辅助函数 ──
function renderL3Row(r) {
  const badge = r.rate > 50 ? '<span class="badge badge-danger">高危</span>' : r.rate > 30 ? '<span class="badge badge-warning">关注</span>' : '<span class="badge badge-success">良好</span>';
  const errorCell = r.topErrors.length > 0
    ? r.topErrors.map(e => `<div style="margin-bottom:4px;"><strong>${e.name}</strong> <span style="color:#6b7280;font-size:12px;">${e.count}次·均扣${e.avg.toFixed(1)}</span></div>`).join('')
    : '<span style="color:#9ca3af;font-size:12px;">—</span>';
  return `<tr>
    <td><strong>${r.smName}</strong></td>
    <td>${r.l3Name}</td>
    <td>${r.count}</td>
    <td>${r.deducted.toFixed(1)}</td>
    <td>
      <div style="display:flex;align-items:center;gap:8px;">
        <div class="progress-bar" style="flex:1"><div class="progress-fill ${r.rate>50?'high':r.rate>30?'mid':'low'}" style="width:${Math.min(r.rate,100)}%"></div></div>
        <span style="font-size:12px;font-weight:600;">${r.rate.toFixed(1)}%</span>
      </div>
    </td>
    <td>${badge}</td>
    <td style="min-width:200px;">${errorCell}</td>
  </tr>`;
}

function filterLevel3() {
  const rows = window._l3Rows || [];
  if (rows.length === 0) return;

  const smSel = document.getElementById('l3-filter-sm');
  const l3Sel = document.getElementById('l3-filter-l3');
  const searchInput = document.getElementById('l3-search');
  if (!smSel || !l3Sel) return;

  const smVal = smSel.value;
  const l3Val = l3Sel.value;
  const keyword = (searchInput?.value || '').trim().toLowerCase();

  // 级联更新三级模块下拉选项
  if (smVal) {
    const filteredL3 = [...new Set(rows.filter(r => r.smName === smVal).map(r => r.l3Name))];
    const currentL3Val = l3Sel.value;
    l3Sel.innerHTML = '<option value="">全部</option>' + filteredL3.map(n => `<option value="${n}" ${n===currentL3Val?'selected':''}>${n}</option>`).join('');
  } else {
    const allL3 = [...new Set(rows.map(r => r.l3Name))];
    const currentL3Val = l3Sel.value;
    l3Sel.innerHTML = '<option value="">全部</option>' + allL3.map(n => `<option value="${n}" ${n===currentL3Val?'selected':''}>${n}</option>`).join('');
  }

  // 实际筛选
  const filtered = rows.filter(r => {
    if (smVal && r.smName !== smVal) return false;
    if (l3Val && r.l3Name !== l3Val) return false;
    if (keyword) {
      const hay = (r.smName + ' ' + r.l3Name + ' ' + r.topErrors.map(e => e.name).join(' ')).toLowerCase();
      if (!hay.includes(keyword)) return false;
    }
    return true;
  });

  // 更新表格
  const tbody = document.getElementById('l3-table-body');
  const noResult = document.getElementById('l3-no-result');
  const table = document.getElementById('l3-table');
  const countEl = document.getElementById('l3-count');

  if (filtered.length === 0) {
    tbody.innerHTML = '';
    table.style.display = 'none';
    noResult.style.display = 'block';
  } else {
    tbody.innerHTML = filtered.map(r => renderL3Row(r)).join('');
    table.style.display = '';
    noResult.style.display = 'none';
  }

  if (countEl) {
    countEl.textContent = filtered.length === rows.length
      ? `共 ${rows.length} 条`
      : `筛选: ${filtered.length} / ${rows.length} 条`;
  }

  // 更新图表
  drawLevel3Chart(filtered);
}

function resetLevel3Filter() {
  const smSel = document.getElementById('l3-filter-sm');
  const l3Sel = document.getElementById('l3-filter-l3');
  const searchInput = document.getElementById('l3-search');
  if (smSel) smSel.value = '';
  if (l3Sel) l3Sel.value = '';
  if (searchInput) searchInput.value = '';
  filterLevel3();
}

function drawLevel3Chart(rows) {
  const canvas = document.getElementById('chart-level3-rate');
  if (!canvas) return;
  const topL3 = rows.slice(0, 20);
  createChart('level3-rate', canvas, {
    type: 'bar',
    data: {
      labels: topL3.map(r => r.l3Name.length > 14 ? r.l3Name.slice(0,14)+'...' : r.l3Name),
      datasets: [{
        label: '失分率 (%)',
        data: topL3.map(r => r.rate),
        backgroundColor: topL3.map(r => r.rate > 50 ? '#ef4444' : r.rate > 30 ? '#f59e0b' : '#3b82f6'),
        borderRadius: 4
      }]
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      plugins: { legend: { display: false } },
      scales: { x: { title: { display: true, text: '失分率 (%)' }, max: 100 } }
    }
  });
}

// ============ ERROR POINTS ============
function renderError() {
  const questions = getFilteredData();

  // ── 统计客观题（下探为空或/）与主观题（有下探）数量 ──
  let objCount = 0, subCount = 0;
  questions.forEach(d => {
    const explore = (d['错误点下探'] || '').trim();
    if (!explore || explore === '/') objCount++;
    else subCount++;
  });

  // ── 按模块聚合错误点→下探 ──
  const moduleOrder = ['语言基础知识','文言文阅读','名著阅读','古诗赏析','现代文阅读','语言综合运用','作文'];
  const moduleData = {};
  moduleOrder.forEach(m => { moduleData[m] = { errors:{}, explores:{}, objCount:0, subCount:0 }; });

  questions.forEach(d => {
    let ep = (d['错误点'] || '').trim();
    let explore = (d['错误点下探'] || '').trim();
    const mod = d['一级模块'] || '';
    if (!moduleData[mod]) return;

    // 归类：客观题 vs 主观题
    if (!explore || explore === '/') {
      moduleData[mod].objCount++;
      // 客观题只记录错误点本身
      if (ep && ep !== '无' && ep !== '/') {
        ep = ep.replace(/\n/g, '、');
        if (!moduleData[mod].errors[ep]) moduleData[mod].errors[ep] = { count:0, deducted:0, isObj:true };
        moduleData[mod].errors[ep].count++;
        moduleData[mod].errors[ep].deducted += safeFloat(d['扣分']);
      }
    } else {
      moduleData[mod].subCount++;
      explore = explore.replace(/\n/g, '、');
      // 主观题：记录下探
      if (!moduleData[mod].explores[explore]) moduleData[mod].explores[explore] = { count:0, deducted:0, parentErrors:new Set() };
      moduleData[mod].explores[explore].count++;
      moduleData[mod].explores[explore].deducted += safeFloat(d['扣分']);
      if (ep && ep !== '无' && ep !== '/') {
        ep = ep.replace(/\n/g, '、');
        moduleData[mod].explores[explore].parentErrors.add(ep);
      }
    }
  });

  // ── 全局错误点 TOP ──
  const allErrorAgg = {};
  questions.forEach(d => {
    let ep = (d['错误点'] || '').trim();
    if (!ep || ep === '无' || ep === '/' || ep === '未作答') return;
    ep = ep.replace(/\n/g, '、');
    if (!allErrorAgg[ep]) allErrorAgg[ep] = { count:0, deducted:0, modules:new Set() };
    allErrorAgg[ep].count++;
    allErrorAgg[ep].deducted += safeFloat(d['扣分']);
    if (d['一级模块']) allErrorAgg[ep].modules.add(d['一级模块']);
  });
  const errorTop = Object.entries(allErrorAgg)
    .map(([k,v]) => ({name:k, count:v.count, deducted:v.deducted, modules:[...v.modules]}))
    .sort((a,b) => b.count - a.count)
    .slice(0, 30);

  let html = filterBarHTML();

  // ── 说明横幅 ──
  html += `
    <div style="background:#fffbeb;border:1px solid #fbbf24;border-radius:8px;padding:14px 20px;margin-bottom:20px;line-height:1.8;">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
        <span style="font-size:20px;">⚠️</span>
        <strong style="color:#92400e;">关于「错误点下探」字段说明</strong>
      </div>
      <div style="color:#78350f;font-size:14px;">
        <strong>客观题</strong>（选择题、判断题等）的错误点往往难以进一步拆解到细粒度，因此这些题目的「错误点下探」列填写了空值或 "/"，仅标注了宏观错误类型。<br>
        <strong>主观题</strong>（阅读理解、作文等）则对错误点做了进一步下探拆解，如"概括不当"、"少点"等。<br>
        当前数据中：<strong style="color:#dc2626;">客观题 ${objCount} 条</strong>（下探为空），<strong style="color:#2563eb;">主观题 ${subCount} 条</strong>（有下探数据）。下方按模块分别展示。
      </div>
    </div>
  `;

  // ── 全局 TOP 30 图 ──
  html += `
    <div class="chart-grid">
      <div class="chart-card full">
        <h3>错误点出现频次 TOP 30</h3>
        <canvas id="chart-error-top"></canvas>
      </div>
    </div>
  `;

  // ── 模块对比柱状图：各模块客观题 vs 主观题占比 ──
  html += `
    <div class="chart-grid">
      <div class="chart-card full">
        <h3>各模块 · 客观题/主观题分布</h3>
        <canvas id="chart-error-obj-sub"></canvas>
      </div>
    </div>
  `;

  // ── 按模块分组展示 ──
  const moduleColors = {
    '语言基础知识':'#6366f1','文言文阅读':'#8b5cf6','名著阅读':'#a855f7',
    '古诗赏析':'#d946ef','现代文阅读':'#ec4899','语言综合运用':'#f43f5e','作文':'#ef4444'
  };

  html += `
    <h2 style="margin-top:20px;font-size:18px;color:#1e3a5f;">📋 按模块分组的错误点下探</h2>
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;align-items:center;padding:12px;background:#f8fafc;border-radius:8px;border:1px solid var(--border);">
      <div style="display:flex;align-items:center;gap:6px;">
        <label style="font-size:13px;color:var(--text-secondary);white-space:nowrap;">模块</label>
        <select id="err-module-filter" onchange="filterErrorModules()" style="padding:6px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:#fff;min-width:130px;">
          <option value="">全部</option>
          ${moduleOrder.map(m => `<option value="${m}">${m}</option>`).join('')}
        </select>
      </div>
      <div style="display:flex;align-items:center;gap:6px;flex:1;min-width:180px;">
        <span style="font-size:14px;">🔍</span>
        <input type="text" id="err-search" placeholder="搜索下探内容/错误点..." oninput="filterErrorModules()" style="padding:6px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px;flex:1;max-width:300px;" />
      </div>
      <button class="btn btn-outline" onclick="resetErrorModuleFilter()" style="font-size:12px;padding:4px 12px;">重置</button>
      <span id="err-module-count" style="font-size:12px;color:var(--text-secondary);white-space:nowrap;">共 ${moduleOrder.filter(m => moduleData[m] && (moduleData[m].objCount + moduleData[m].subCount) > 0).length} 个模块</span>
    </div>
    <div id="error-module-container"></div>
  `;

  // ── 全局错误点详细列表 ──
  html += `
    <div class="chart-card" style="margin-bottom:20px;">
      <h3>错误点全局汇总</h3>
      <table class="data-table">
        <thead><tr><th>错误点</th><th>出现次数</th><th>平均扣分</th><th>关联模块</th></tr></thead>
        <tbody>
        ${errorTop.map(e => `<tr>
          <td>${e.name}</td>
          <td><strong>${e.count}</strong></td>
          <td style="color:#ef4444;font-weight:600;">${(e.deducted / e.count).toFixed(2)}</td>
          <td>${e.modules.join('、')}</td>
        </tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;

  document.getElementById('main-content').innerHTML = html;

  // 保存数据并渲染按模块分组的错误点下探
  window._moduleData = moduleData;
  window._moduleColors = moduleColors;
  window._moduleOrder = moduleOrder;
  renderErrorModuleCards();

  // ── 全局 TOP 30 柱状图 ──
  createChart('error-top', document.getElementById('chart-error-top'), {
    type: 'bar',
    data: {
      labels: errorTop.map(e => e.name.length > 15 ? e.name.slice(0,15)+'...' : e.name),
      datasets: [{
        label: '出现次数', data: errorTop.map(e => e.count),
        backgroundColor: errorTop.map(e => e.count > 20 ? '#ef4444' : e.count > 10 ? '#f59e0b' : '#3b82f6'),
        borderRadius: 4
      }]
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      plugins: { legend: { display: false } },
      scales: { x: { title: { display: true, text: '出现频次' } } }
    }
  });

  // ── 模块客观/主观占比图 ──
  const activeModules = moduleOrder.filter(m => moduleData[m] && (moduleData[m].objCount + moduleData[m].subCount) > 0);
  createChart('error-obj-sub', document.getElementById('chart-error-obj-sub'), {
    type: 'bar',
    data: {
      labels: activeModules,
      datasets: [
        {
          label: '客观题（无下探）',
          data: activeModules.map(m => moduleData[m].objCount),
          backgroundColor: '#fbbf24',
          borderRadius: 4
        },
        {
          label: '主观题（有下探）',
          data: activeModules.map(m => moduleData[m].subCount),
          backgroundColor: '#3b82f6',
          borderRadius: 4
        }
      ]
    },
    options: {
      responsive: true,
      plugins: { legend: { position: 'top' } },
      scales: { x: { stacked: true }, y: { stacked: true, title: { display: true, text: '题目数' } } }
    }
  });
}

// ── 按模块分组的错误点下探：筛选辅助函数 ──
function renderErrorModuleCards() {
  const moduleData = window._moduleData || {};
  const moduleColors = window._moduleColors || {};
  const moduleOrder = window._moduleOrder || [];
  const container = document.getElementById('error-module-container');
  if (!container) return;

  const modSel = document.getElementById('err-module-filter');
  const searchInput = document.getElementById('err-search');
  const modVal = modSel ? modSel.value : '';
  const keyword = (searchInput ? searchInput.value : '').trim().toLowerCase();

  let visibleCount = 0;
  let html = '';

  moduleOrder.forEach(mod => {
    const md = moduleData[mod];
    if (!md || (md.objCount === 0 && md.subCount === 0)) return;

    // 按关键词过滤主观题和客观题错误点
    const subRows = Object.entries(md.explores)
      .map(([k,v]) => ({name:k, count:v.count, avgDeducted: v.deducted/v.count, parentErrors:[...v.parentErrors]}))
      .sort((a,b) => b.count - a.count)
      .filter(e => !keyword || (e.name + ' ' + e.parentErrors.join(' ')).toLowerCase().includes(keyword));

    const objRows = Object.entries(md.errors)
      .map(([k,v]) => ({name:k, count:v.count, avgDeducted: v.deducted/v.count}))
      .sort((a,b) => b.count - a.count)
      .filter(e => !keyword || e.name.toLowerCase().includes(keyword));

    // 模块下拉选择：只显示指定模块
    if (modVal && modVal !== mod) return;

    // 关键词搜索：无匹配行时跳过该模块
    if (keyword && subRows.length === 0 && objRows.length === 0) return;

    visibleCount++;
    html += renderErrorModuleCard(mod, md, subRows, objRows);
  });

  container.innerHTML = html || '<div style="text-align:center;padding:32px;color:#9ca3af;font-size:14px;">未找到匹配的错误点</div>';

  const countEl = document.getElementById('err-module-count');
  if (countEl) {
    const total = moduleOrder.filter(m => moduleData[m] && (moduleData[m].objCount + moduleData[m].subCount) > 0).length;
    countEl.textContent = modVal ? `${modVal} · 1 个模块` : keyword ? `筛选: ${visibleCount} / ${total} 个模块` : `共 ${total} 个模块`;
  }
}

function renderErrorModuleCard(mod, md, subRows, objRows) {
  const moduleColors = window._moduleColors || {};
  const color = moduleColors[mod] || '#3b82f6';
  return `
    <div class="chart-card" style="margin-bottom:20px;border-left:4px solid ${color};">
      <h3 style="color:${color};margin-bottom:4px;">${mod}</h3>
      <div style="font-size:12px;color:#6b7280;margin-bottom:12px;">
        客观题 ${md.objCount} 条 · 主观题（有下探）${md.subCount} 条
      </div>

      ${subRows.length > 0 ? `
      <h4 style="font-size:14px;color:#1e3a5f;margin-bottom:8px;">🔍 主观题错误点下探</h4>
      <table class="data-table">
        <thead><tr><th>下探内容</th><th>频次</th><th>平均扣分</th><th>来源错误点</th></tr></thead>
        <tbody>
        ${subRows.map(e => `<tr>
          <td style="max-width:300px;white-space:normal;">${e.name}</td>
          <td><strong>${e.count}</strong></td>
          <td style="color:#ef4444;font-weight:600;">${e.avgDeducted.toFixed(2)}</td>
          <td style="color:#6b7280;font-size:12px;">${e.parentErrors.join('、') || '—'}</td>
        </tr>`).join('')}
        </tbody>
      </table>
      ` : '<div style="color:#9ca3af;font-size:13px;padding:8px 0;">该模块无主观题下探数据</div>'}

      ${objRows.length > 0 ? `
      <h4 style="font-size:14px;color:#6b7280;margin-top:12px;margin-bottom:8px;">📋 客观题错误点（无下探）</h4>
      <table class="data-table">
        <thead><tr><th>错误点</th><th>频次</th><th>平均扣分</th></tr></thead>
        <tbody>
        ${objRows.map(e => `<tr>
          <td>${e.name}</td>
          <td><strong>${e.count}</strong></td>
          <td style="color:#f59e0b;font-weight:600;">${e.avgDeducted.toFixed(2)}</td>
        </tr>`).join('')}
        </tbody>
      </table>
      ` : ''}
    </div>
  `;
}

function filterErrorModules() {
  renderErrorModuleCards();
}

function resetErrorModuleFilter() {
  const modSel = document.getElementById('err-module-filter');
  const searchInput = document.getElementById('err-search');
  if (modSel) modSel.value = '';
  if (searchInput) searchInput.value = '';
  renderErrorModuleCards();
}

// ============ CROSS COMPARISON ============
function renderCross() {
  const questions = getFilteredData();

  // Group students by score range from sheet2 (always use full list for segment mapping)
  const studentScores = {};
  window.rawStudents.forEach(s => {
    studentScores[s['姓名']] = s['得分率区间'];
  });

  // Score segments
  const segments = ['80-100%', '60-80%', '40-60%'];
  const segColors = { '80-100%': '#10b981', '60-80%': '#3b82f6', '40-60%': '#f59e0b' };

  // Module definitions
  const allModules = ['语言基础知识','文言文阅读','名著阅读','古诗赏析','现代文阅读','语言综合运用','作文'];
  
  // Aggregate: for each segment, calculate per-module error rate
  const segAgg = {};
  segments.forEach(seg => {
    segAgg[seg] = {};
    allModules.forEach(m => { segAgg[seg][m] = { deducted:0, total:0, count:0 }; });
  });

  questions.forEach(d => {
    const name = d['姓名'];
    const seg = studentScores[name];
    if (!seg || !segments.includes(seg)) return;
    const m = d['一级模块'];
    if (!m || !allModules.includes(m)) return;
    segAgg[seg][m].deducted += safeFloat(d['扣分']);
    segAgg[seg][m].total += safeFloat(d['满分']);
    segAgg[seg][m].count++;
  });

  // Student count per segment
  const segCounts = {};
  segments.forEach(seg => {
    segCounts[seg] = window.rawStudents.filter(s => s['得分率区间'] === seg).length;
  });

  let html = filterBarHTML();
  
  // Summary cards
  html += '<div class="stat-cards">';
  segments.forEach(seg => {
    html += `<div class="stat-card">
      <div class="label">${seg} 分数段</div>
      <div class="value" style="color:${segColors[seg]}">${segCounts[seg]}<span style="font-size:14px;color:#6b7280;"> 人</span></div>
    </div>`;
  });
  html += '</div>';

  // Chart: multi-bar comparison
  html += `
    <div class="chart-grid">
      <div class="chart-card full">
        <h3>不同分数段 · 各模块失分率对比</h3>
        <canvas id="chart-cross-module"></canvas>
      </div>
    </div>
  `;

  // Heatmap-style table
  html += `<div class="chart-card" style="margin-bottom:20px;"><h3>分数段×模块 失分率矩阵</h3>`;
  html += `<table class="data-table"><thead><tr><th>模块</th>${segments.map(s=>`<th>${s}<br><span style="font-weight:400;font-size:11px;">${segCounts[s]}人</span></th>`).join('')}<th>差异</th></tr></thead><tbody>`;

  allModules.forEach(m => {
    const rates = segments.map(s => {
      const a = segAgg[s][m];
      return safeCalcRate(a.deducted, a.total);
    });
    const diff = rates[2] - rates[0]; // 低分段 - 高分段
    html += `<tr>
      <td><strong>${m}</strong></td>
      ${rates.map((r,i) => {
        let bg = r > 50 ? '#fee2e2' : r > 30 ? '#fef3c7' : '#d1fae5';
        return `<td style="background:${bg};font-weight:600;text-align:center;">${r.toFixed(1)}%</td>`;
      }).join('')}
      <td style="text-align:center;font-weight:700;color:${diff>15?'#ef4444':diff>5?'#f59e0b':'#10b981'}">${diff>0?'+':''}${diff.toFixed(1)}%</td>
    </tr>`;
  });

  html += '</tbody></table></div>';

  // Key findings
  html += `<div class="chart-card" style="margin-bottom:20px;">
    <h3>关键发现：不同层次学员的薄弱点差异</h3><div style="font-size:14px;line-height:2;">`;

  const findings = allModules.map(m => {
    const rates = segments.map(s => safeCalcRate(segAgg[s][m].deducted, segAgg[s][m].total));
    const diff = rates[2] - rates[0];
    return { module: m, diff, rates };
  }).sort((a,b) => b.diff - a.diff);

  findings.forEach(f => {
    const icon = f.diff > 15 ? '🔴' : f.diff > 5 ? '🟡' : '🟢';
    html += `<div>${icon} <strong>${f.module}</strong>：40-60%段失分率 ${f.rates[2].toFixed(1)}%，80-100%段失分率 ${f.rates[0].toFixed(1)}%，差距 ${f.diff > 0 ? '+' : ''}${f.diff.toFixed(1)}%。${
      f.diff > 15 ? '⚠️ 差异显著，低分段学员在此模块存在明显短板' :
      f.diff > 5 ? '⚡ 存在一定差距，需要分层强化' :
      '✅ 各层次学员表现较均衡'}</div>`;
  });

  html += '</div></div>';

  document.getElementById('main-content').innerHTML = html;

  // Chart
  const datasets = segments.map((seg, i) => ({
    label: `${seg} (${segCounts[seg]}人)`,
    data: allModules.map(m => safeCalcRate(segAgg[seg][m].deducted, segAgg[seg][m].total)),
    backgroundColor: segColors[seg],
    borderRadius: 4
  }));

  createChart('cross-module', document.getElementById('chart-cross-module'), {
    type: 'bar',
    data: { labels: allModules, datasets },
    options: {
      responsive: true,
      plugins: { 
        legend: { position: 'top' },
        tooltip: { callbacks: { label: ctx => `${ctx.dataset.label}: ${ctx.raw.toFixed(1)}%` } }
      },
      scales: { y: { ticks: { callback: v => v+'%' }, title: { display: true, text: '失分率' } } }
    }
  });
}

// ============ STUDENTS TABLE ============
function renderStudents() {
  const allStudents = window.rawStudents;
  const questions = window.rawQuestions;

  let html = filterBarHTML();

  // Apply grade / semester / exam-type filters
  const gradeFilter = document.getElementById('f-grade')?.value || '';
  const semFilter = document.getElementById('f-semester')?.value || '';
  const examFilter = document.getElementById('f-exam-type')?.value || '';
  let students = allStudents.filter(s => {
    if (gradeFilter && s['年级'] !== gradeFilter && s['年级']) return false;
    if (semFilter && (s['学期']||'') !== semFilter) return false;
    if (examFilter && (s['考试类别']||'') !== examFilter) return false;
    return true;
  });

  // Search
  html += `<div style="margin-bottom:12px;"><input id="student-search" type="text" placeholder="搜索学生姓名..." style="padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:14px;width:250px;" oninput="filterStudentTable()"></div>`;
  html += `<div style="margin-bottom:12px;color:var(--text-muted);font-size:13px;">共 ${students.length} 名学生</div>`;

  // Module columns from sheet2
  const modules = ['语言基础知识','文言文阅读','名著阅读','古诗赏析','现代文阅读','语言综合运用','作文'];

  html += `<div style="overflow-x:auto;"><table class="data-table" id="student-table">
    <thead><tr>
      <th>年级</th><th>考试类别</th><th>姓名</th><th>生源地</th><th>总扣分</th><th>总满分</th><th>整体失分率</th><th>得分率区间</th>
      ${modules.map(m => `<th>${m}<br><span style="font-weight:400;font-size:10px">扣分/满分</span></th>`).join('')}
    </tr></thead><tbody>`;

  // Build student region map from questions
  const studentRegion = {};
  questions.forEach(d => {
    if (d['姓名'] && d['生源地']) studentRegion[d['姓名']] = d['生源地'];
  });

  students.forEach(s => {
    const name = s['姓名'];
    const region = s['生源地'] || studentRegion[name] || '-';
    const grade = s['年级'] || '-';
    const examType = s['考试类别'] || '-';
    const examBadge = examType === '期末'
      ? '<span class="badge" style="background:#8b5cf6;color:#fff;">期末</span>'
      : examType === '期中'
        ? '<span class="badge" style="background:#3b82f6;color:#fff;">期中</span>'
        : `<span class="badge">${examType}</span>`;
    const lossRate = safePct(s['整体失分率'] || '0');
    const badge = lossRate > 40 ? 'badge-danger' : lossRate > 25 ? 'badge-warning' : 'badge-success';
    html += `<tr class="student-row" data-name="${name}" data-score-range="${s['得分率区间']||''}">
      <td>${grade}</td>
      <td>${examBadge}</td>
      <td><strong>${name}</strong></td>
      <td>${region}</td>
      <td style="color:#ef4444;font-weight:600;">${s['总扣分']}</td>
      <td>${s['总满分']}</td>

function filterStudentTable() {

// ============ GRADE COMPARISON ============
function renderGradeCompare() {
  const gradeData = window.gradeData || {};
  const gradeNames = Object.keys(gradeData).sort();

  if (gradeNames.length === 0) {
    document.getElementById('main-content').innerHTML = '<div style="text-align:center;padding:60px;color:#999;">暂无年级数据，请先在「数据更新」页面上传各年级学情库。</div>';
    return;
  }

  const gradeColors = ['#6366f1', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#06b6d4', '#ec4899'];
  const modules = ['语言基础知识','文言文阅读','名著阅读','古诗赏析','现代文阅读','语言综合运用','作文'];

  // Overview cards: one per grade
  let cardsHtml = '<div class="stat-cards" style="margin-bottom:24px;">';
  gradeNames.forEach((g, i) => {
    const gd = gradeData[g];
    const studentCount = gd.students.length;
    const totalDeducted = gd.questions.reduce((s, d) => s + safeFloat(d['扣分']), 0);
    const totalFull = gd.questions.reduce((s, d) => s + safeFloat(d['满分']), 0);
    const lossRate = safeCalcRate(totalDeducted, totalFull);
    const qCount = gd.questions.length;
    const color = gradeColors[i % gradeColors.length];
    cardsHtml += `
      <div class="stat-card" style="border-left:4px solid ${color};">
        <div class="label" style="font-size:16px;font-weight:700;color:${color};">${g}</div>
        <div style="display:flex;gap:24px;margin-top:8px;">
          <div><div style="font-size:12px;color:var(--text-secondary);">学生数</div><div style="font-size:20px;font-weight:700;">${studentCount}</div></div>
          <div><div style="font-size:12px;color:var(--text-secondary);">题目数</div><div style="font-size:20px;font-weight:700;">${qCount}</div></div>
          <div><div style="font-size:12px;color:var(--text-secondary);">整体失分率</div><div style="font-size:20px;font-weight:700;color:${lossRate > 30 ? '#ef4444' : lossRate > 20 ? '#f59e0b' : '#10b981'};">${lossRate.toFixed(1)}%</div></div>
        </div>
      </div>`;
  });
  cardsHtml += '</div>';

  // Module comparison chart data
  const moduleData = {};
  modules.forEach(m => {
    moduleData[m] = {};
    gradeNames.forEach(g => {
      const qs = gradeData[g].questions.filter(d => d['一级模块'] === m);
      const ded = qs.reduce((s, d) => s + safeFloat(d['扣分']), 0);
      const tot = qs.reduce((s, d) => s + safeFloat(d['满分']), 0);
      moduleData[m][g] = safeCalcRate(ded, tot);
    });
  });

  // Score segment distribution
  const segments = ['80-100%', '60-80%', '40-60%'];
  const segData = {};
  segments.forEach(seg => {
    segData[seg] = {};
    gradeNames.forEach(g => {
      segData[seg][g] = gradeData[g].students.filter(s => s['得分率区间'] === seg).length;
    });
  });

  // Region comparison
  const allRegions = [...new Set([])];
  gradeNames.forEach(g => {
    gradeData[g].questions.forEach(d => {
      if (d['生源地']) allRegions.push(d['生源地']);
    });
  });
  const regions = [...new Set(allRegions)].sort();
  const regionData = {};
  regions.forEach(r => {
    regionData[r] = {};
    gradeNames.forEach(g => {
      const qs = gradeData[g].questions.filter(d => d['生源地'] === r);
      const ded = qs.reduce((s, d) => s + safeFloat(d['扣分']), 0);
      const tot = qs.reduce((s, d) => s + safeFloat(d['满分']), 0);
      regionData[r][g] = safeCalcRate(ded, tot);
    });
  });

  // Find weakest module per grade
  const weakestModule = {};
  gradeNames.forEach(g => {
    let worst = { module: '', rate: 0 };
    modules.forEach(m => {
      const rate = moduleData[m][g];
      if (rate > worst.rate) worst = { module: m, rate };
    });
    weakestModule[g] = worst;
  });

  let html = `
    <h2 style="margin-bottom:16px;">年级对比分析</h2>
    ${cardsHtml}

    <div style="margin-bottom:12px;padding:12px 16px;background:#f0f9ff;border-radius:8px;border:1px solid #bae6fd;font-size:14px;color:#0c4a6e;">
      当前共有 <strong>${gradeNames.length}</strong> 个年级数据：${gradeNames.map((g, i) => `<span style="display:inline-block;padding:2px 10px;border-radius:12px;background:${gradeColors[i % gradeColors.length]};color:#fff;font-size:12px;margin:0 4px;">${g}</span>`).join('')}
      &nbsp;&nbsp;需添加更多年级？请前往「📤 数据更新」上传其他年级的学情库。
    </div>

    <div class="chart-grid">
      <div class="chart-card full">
        <h3>各年级模块失分率对比</h3>
        <canvas id="chart-grade-module"></canvas>
      </div>
    </div>

    <div class="chart-grid">
      <div class="chart-card">
        <h3>各年级分数段分布</h3>
        <canvas id="chart-grade-segment"></canvas>
      </div>
      <div class="chart-card">
        <h3>各年级地区失分率对比</h3>
        <canvas id="chart-grade-region"></canvas>
      </div>
    </div>

    <div class="chart-card" style="margin-bottom:20px;">
      <h3>各年级薄弱模块一览</h3>
      <table class="data-table">
        <thead><tr><th>年级</th><th>学生数</th><th>题目数</th><th>整体失分率</th><th>最薄弱模块</th><th>该模块失分率</th></tr></thead>
        <tbody>
        ${gradeNames.map((g, i) => {
          const gd = gradeData[g];
          const totalDed = gd.questions.reduce((s, d) => s + safeFloat(d['扣分']), 0);
          const totalFull = gd.questions.reduce((s, d) => s + safeFloat(d['满分']), 0);
          const overallRate = safeCalcRate(totalDed, totalFull);
          const wm = weakestModule[g];
          return `<tr>
            <td><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${gradeColors[i % gradeColors.length]};margin-right:6px;"></span><strong>${g}</strong></td>
            <td>${gd.students.length}</td>
            <td>${gd.questions.length}</td>
            <td><span class="badge ${overallRate > 30 ? 'badge-danger' : overallRate > 20 ? 'badge-warning' : 'badge-success'}">${overallRate.toFixed(1)}%</span></td>
            <td style="color:#ef4444;font-weight:600;">${wm.module || '-'}</td>
            <td>${wm.rate.toFixed(1)}%</td>
          </tr>`;
        }).join('')}
        </tbody>
      </table>
    </div>

    <div class="chart-card" style="margin-bottom:20px;">
      <h3>模块 × 年级 失分率矩阵</h3>
      <table class="data-table">
        <thead><tr>
          <th>一级模块</th>
          ${gradeNames.map(g => `<th>${g}</th>`).join('')}
        </tr></thead>
        <tbody>
        ${modules.map(m => {
          const cells = gradeNames.map(g => {
            const rate = moduleData[m][g];
            const bg = rate > 35 ? '#fecaca' : rate > 25 ? '#fef3c7' : rate > 0 ? '#d1fae5' : '#f3f4f6';
            const fg = rate > 35 ? '#991b1b' : rate > 25 ? '#92400e' : '#065f46';
            return `<td style="background:${bg};color:${fg};font-weight:600;text-align:center;">${rate > 0 ? rate.toFixed(1) + '%' : '-'}</td>`;
          }).join('');
          return `<tr><td><strong>${m}</strong></td>${cells}</tr>`;
        }).join('')}
        </tbody>
      </table>
    </div>
  `;

  document.getElementById('main-content').innerHTML = html;

  // Chart 1: Module comparison grouped bar
  createChart('grade-module', document.getElementById('chart-grade-module'), {
    type: 'bar',
    data: {
      labels: modules,
      datasets: gradeNames.map((g, i) => ({
        label: g,
        data: modules.map(m => moduleData[m][g]),
        backgroundColor: gradeColors[i % gradeColors.length],
        borderRadius: 4
      }))
    },
    options: {
      responsive: true,
      plugins: { tooltip: { mode: 'index', intersect: false } },
      scales: { y: { title: { display: true, text: '失分率 (%)' }, ticks: { callback: v => v + '%' } } }
    }
  });

  // Chart 2: Score segment distribution
  createChart('grade-segment', document.getElementById('chart-grade-segment'), {
    type: 'bar',
    data: {
      labels: segments,
      datasets: gradeNames.map((g, i) => ({
        label: g,
        data: segments.map(s => segData[s][g]),
        backgroundColor: gradeColors[i % gradeColors.length],
        borderRadius: 4
      }))
    },
    options: {
      responsive: true,
      plugins: { tooltip: { mode: 'index' } },
      scales: { y: { title: { display: true, text: '人数' }, beginAtZero: true } }
    }
  });

  // Chart 3: Region comparison
  createChart('grade-region', document.getElementById('chart-grade-region'), {
    type: 'bar',
    data: {
      labels: regions.length > 0 ? regions : ['暂无地区数据'],
      datasets: gradeNames.length > 1 ? gradeNames.map((g, i) => ({
        label: g,
        data: regions.length > 0 ? regions.map(r => regionData[r][g]) : [0],
        backgroundColor: gradeColors[i % gradeColors.length],
        borderRadius: 4
      })) : [{
        label: gradeNames[0] || '',
        data: regions.length > 0 ? regions.map(r => regionData[r][gradeNames[0]]) : [0],
        backgroundColor: gradeColors[0],
        borderRadius: 4
      }]
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      plugins: { tooltip: { mode: 'index' } },
      scales: { x: { title: { display: true, text: '失分率 (%)' }, ticks: { callback: v => v + '%' } } }
    }
  });
}

// ============ SEMESTER COMPARISON ============
function getSemesterGroups() {
  const questions = window.rawQuestions || [];
  const groups = {};
  questions.forEach(d => {
    const sem = getSemester(d);
    const et = getExamType(d);
    if (!sem && !et) return;
    const key = sem && et ? `${sem}-${et}` : (sem || et);
    if (!groups[key]) groups[key] = [];
    groups[key].push(d);
  });
  return groups;
}

function renderSemesterCompare() {
  const questions = window.rawQuestions || [];
  const students = window.rawStudents || [];
  const semGroups = getSemesterGroups();

  if (semNames.length === 0) {
    document.getElementById('main-content').innerHTML = '<div style="text-align:center;padding:60px;color:#999;">当前数据暂无「学期」或「考试类型」字段，请在Excel中补充这两列后重新上传数据。</div>';
    return;
  }

  const semColors = ['#6366f1', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#06b6d4', '#ec4899'];

  const semStudents = {};
  semNames.forEach(s => {

    const lossRate = safeCalcRate(totalDeducted, totalFull);
    const color = semColors[i % semColors.length];
    cardsHtml += `
      <div class="stat-card" style="border-left:4px solid ${color};">

        </div>
      </div>`;
  });
  cardsHtml += '</div>';

  // Module comparison data
  const moduleData = {};
  modules.forEach(m => {
    moduleData[m] = {};
    semNames.forEach(s => {
      const qs = semGroups[s].filter(d => d['一级模块'] === m);
      const ded = qs.reduce((sum, d) => sum + safeFloat(d['扣分']), 0);
      const tot = qs.reduce((sum, d) => sum + safeFloat(d['满分']), 0);
      moduleData[m][s] = safeCalcRate(ded, tot);
    });
  });

  // Score segment distribution (use students whose any question belongs to this semester)
  const segments = ['80-100%', '60-80%', '40-60%'];
  const segData = {};
  segments.forEach(seg => {
    segData[seg] = {};

      <div style="margin-top:16px;display:flex;gap:12px;">
        <button class="btn btn-outline" onclick="downloadAllGradeData()">💾 导出全部年级数据</button>
        <button class="btn btn-primary" onclick="resetGradeData()">🔄 恢复初始数据</button>
      </div>
    </div>
  `;

  document.getElementById('main-content').innerHTML = html;

  // Drag & drop
  const zone = document.getElementById('upload-zone');
  if (zone) {
    zone.addEventListener('dragover', e => { e.preventDefault(); zone.style.borderColor = 'var(--primary)'; });
    zone.addEventListener('dragleave', () => { zone.style.borderColor = 'var(--border)'; });
    zone.addEventListener('drop', e => {
      e.preventDefault();
      zone.style.borderColor = 'var(--border)';
      const file = e.dataTransfer.files[0];
      if (file) processExcelFile(file);
    });
  }
}

function handleFileUpload(event) {
  const file = event.target.files[0];
  if (file) processExcelFile(file);
}

function processExcelFile(file) {
  const statusEl = document.getElementById('upload-status');
  statusEl.innerHTML = '<div style="padding:12px;background:#eef2ff;border-radius:6px;">⏳ 正在解析文件...</div>';

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type: 'array' });

      // Find sheets - try matching names or use first two
      const sheetNames = workbook.SheetNames;
      let qSheet, sSheet;
      
      for (const name of sheetNames) {
        const lower = name.toLowerCase();
        if (lower.includes('学情库') || lower.includes('题库') || lower.includes('数据')) qSheet = name;
        if (lower.includes('成绩') || lower.includes('汇总') || lower.includes('学生')) sSheet = name;
      }
      if (!qSheet) qSheet = sheetNames[0];
      if (!sSheet) sSheet = sheetNames[sheetNames.length - 1];

      // Parse questions sheet
      const qRaw = XLSX.utils.sheet_to_json(workbook.Sheets[qSheet], { defval: '' });
      const questions = qRaw.map(row => {
        const d = {};
        Object.keys(row).forEach(k => { d[k] = String(row[k]).trim(); });
        return d;
      });

      // Parse students sheet
      const sRaw = XLSX.utils.sheet_to_json(workbook.Sheets[sSheet], { defval: '' });
      const students = sRaw.map(row => {
        const d = {};
        Object.keys(row).forEach(k => { d[k] = String(row[k]).trim(); });
        return d;
      });

      // Detect grade from data
      const gradeSet = new Set();
      questions.forEach(d => {
        const g = (d['年级'] || '').trim();
        if (g) gradeSet.add(g);
      });
      const detectedGrades = [...gradeSet];

      if (detectedGrades.length === 0) {
        throw new Error('未在数据中找到「年级」列，请检查Excel格式');
      }

      // Store each grade separately
      window.gradeData = window.gradeData || {};
      detectedGrades.forEach(g => {
        window.gradeData[g] = {
          questions: questions.filter(d => (d['年级'] || '').trim() === g),
          students: students
        };
      });

      // Also update rawQuestions/rawStudents for current view (use first detected grade)
      window.rawQuestions = window.gradeData[detectedGrades[0]].questions;
      window.rawStudents = students;
      window.dataLoaded = true;

      // Persist to localStorage
      try {
        localStorage.setItem('db_gradeData', JSON.stringify(window.gradeData));
      } catch(e) {}

      const gradeLabels = detectedGrades.map(g => `${g}(${window.gradeData[g].questions.length}题)`).join('、');
      statusEl.innerHTML = `<div style="padding:12px;background:#d1fae5;border-radius:6px;color:#065f46;">
        ✅ 上传成功！<br>
        识别年级：<strong>${detectedGrades.join('、')}</strong><br>
        题目数据：<strong>${questions.length}</strong> 条<br>
        学生数据：<strong>${students.length}</strong> 人<br>
        工作表：${qSheet} / ${sSheet}
      </div>`;

      showToast(`数据更新成功：${gradeLabels}`);
      setTimeout(() => switchView('grade'), 1500);

    } catch(err) {
      statusEl.innerHTML = `<div style="padding:12px;background:#fee2e2;border-radius:6px;color:#991b1b;">❌ 解析失败：${err.message}<br>请检查Excel文件格式是否与模板一致。</div>`;
    }
  };
  reader.readAsArrayBuffer(file);
}

// ============ LOAD FROM LOCALSTORAGE ON START ============
// Static deployment: always use embedded data on first load.
// LocalStorage auto-load disabled to avoid stale/corrupted data overriding embedded JSON.
function checkLocalData() {
  // Try to load saved grade data from localStorage (from uploads)
  try {
    const saved = localStorage.getItem('db_gradeData');
    if (saved) {
      const parsed = JSON.parse(saved);
      if (parsed && Object.keys(parsed).length > 0) {
        window.gradeData = parsed;
        // Set rawQuestions/rawStudents to first grade's data
        const firstGrade = Object.keys(parsed)[0];
        window.rawQuestions = parsed[firstGrade].questions;
        window.rawStudents = parsed[firstGrade].students;
      }
    }
  } catch(e) {}
}

function removeGradeData(gradeName) {
  if (!window.gradeData || !window.gradeData[gradeName]) return;
  delete window.gradeData[gradeName];
  try { localStorage.setItem('db_gradeData', JSON.stringify(window.gradeData)); } catch(e) {}
  // Update rawQuestions if needed
  const remaining = Object.keys(window.gradeData);
  if (remaining.length > 0) {
    window.rawQuestions = window.gradeData[remaining[0]].questions;
    window.rawStudents = window.gradeData[remaining[0]].students;
  }
  renderUpdate();
  showToast(`已移除「${gradeName}」`);
}

function resetGradeData() {
  localStorage.removeItem('db_gradeData');
  location.reload();
}

function downloadAllGradeData() {
  if (!window.gradeData) return;
  const blob = new Blob([JSON.stringify(window.gradeData, null, 2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'grade_data_all.json'; a.click();
  showToast('数据已导出');
}

// ============ EXPORT ============
function exportReport() {
  if (!window.rawQuestions) return;
  const questions = window.rawQuestions;
  const students = window.rawStudents;
  
  // Generate simple report
  const wsData = [['模块','题目数','总扣分','总满分','失分率']];
  const modules = {};
  questions.forEach(d => {
    const m = d['一级模块']; if (!m) return;
    if (!modules[m]) modules[m] = {count:0, deducted:0, total:0};
    modules[m].count++;
    modules[m].deducted += safeFloat(d['扣分']);
    modules[m].total += safeFloat(d['满分']);
  });
  Object.entries(modules).sort((a,b)=>safeCalcRate(b[1].deducted,b[1].total)-safeCalcRate(a[1].deducted,a[1].total))
    .forEach(([k,v])=>wsData.push([k, v.count, v.deducted, v.total, safeCalcRate(v.deducted,v.total).toFixed(1)+'%']));

  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(wsData);
  XLSX.utils.book_append_sheet(wb, ws, '模块汇总');
  XLSX.writeFile(wb, '学情库分析报告.xlsx');
  showToast('报告已导出');
}

function downloadDataJSON() {
  if (!window.rawQuestions) return;
  const blob = new Blob([JSON.stringify(window.rawQuestions, null, 2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'data_questions.json'; a.click();

  const blob2 = new Blob([JSON.stringify(window.rawStudents, null, 2)], {type:'application/json'});
  const a2 = document.createElement('a'); a2.href = URL.createObjectURL(blob2);
  a2.download = 'data_students.json'; a2.click();
  showToast('数据已导出');
}
</script>
